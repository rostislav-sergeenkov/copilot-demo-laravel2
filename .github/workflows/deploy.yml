name: Deploy to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Previous Deployment Tag
        id: previous-tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous deployment tag found, using first commit"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "previous-tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous deployment: $PREVIOUS_TAG"

      - name: Generate Release Notes
        id: release-notes
        run: |
          PREVIOUS_TAG="${{ steps.previous-tag.outputs.previous-tag }}"
          CURRENT_SHA="${{ github.sha }}"
          
          echo "Generating release notes from $PREVIOUS_TAG to $CURRENT_SHA"
          
          # Generate commit log
          COMMITS=$(git log $PREVIOUS_TAG..$CURRENT_SHA --pretty=format:"- %s (%h)" --no-merges)
          
          # Count commits
          COMMIT_COUNT=$(git rev-list --count $PREVIOUS_TAG..$CURRENT_SHA --no-merges)
          
          # Get date range
          START_DATE=$(git log $PREVIOUS_TAG -1 --format=%ai 2>/dev/null || echo "N/A")
          END_DATE=$(git log $CURRENT_SHA -1 --format=%ai)
          
          # Create release notes
          RELEASE_NOTES="## Deployment to Production
          
          Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commits: $COMMIT_COUNT changes
          Period: $START_DATE to $END_DATE
          
          Changes:
          $COMMITS
          
          Deployed by: ${{ github.actor }}
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Print release notes to CI/CD log
          echo "$RELEASE_NOTES"

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: ./laravel-app
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Wait for Deployment
        if: success()
        run: |
          echo "⏳ Waiting 30 seconds for app to start..."
          sleep 30

      - name: Health Check - Application Info
        if: success()
        working-directory: ./laravel-app
        run: |
          echo "🔍 Running health checks..."
          echo "================================"
          echo ""
          echo "📊 Application Info:"
          flyctl ssh console -C "php artisan about --only=environment,cache,queue"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: false

      - name: Health Check - Database Connection
        if: success()
        working-directory: ./laravel-app
        run: |
          echo ""
          echo "💾 Database Check:"
          flyctl ssh console -C "php artisan tinker --execute='echo \"Database: \" . DB::connection()->getDatabaseName() . PHP_EOL; echo \"Expenses count: \" . App\\Models\\Expense::count() . PHP_EOL;'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: false

      - name: Health Check - Route Validation
        if: success()
        working-directory: ./laravel-app
        run: |
          echo ""
          echo "🛣️  Route Check:"
          flyctl ssh console -C "php artisan route:list --columns=Method,URI,Name | grep -E '(login|expenses)' | head -10"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: true

      - name: Health Check - HTTP Endpoint
        if: success()
        working-directory: ./laravel-app
        run: |
          echo ""
          echo "🌐 HTTP Health Check:"
          APP_URL=$(flyctl info --json | jq -r '.Hostname')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_URL}/login" || echo "000")
          echo "Login page status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Application is responding correctly"
          else
            echo "⚠️  Warning: Unexpected HTTP status code"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health Check Summary
        if: success()
        run: |
          echo ""
          echo "================================"
          echo "✅ All health checks passed!"
          echo "🚀 Deployment successful and verified"

      - name: Create Deployment Tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="deploy-$(date -u +%Y%m%d-%H%M%S)"
          git tag -a "$TAG_NAME" -m "Deployment on $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push origin "$TAG_NAME"
