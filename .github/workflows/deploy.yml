name: Deploy to Fly.io

on:
  workflow_run:
    workflows: ["Laravel Quality Gates"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Previous Deployment Tag
        id: previous-tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous deployment tag found, using first commit"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "previous-tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous deployment: $PREVIOUS_TAG"

      - name: Generate Release Notes
        id: release-notes
        run: |
          PREVIOUS_TAG="${{ steps.previous-tag.outputs.previous-tag }}"
          CURRENT_SHA="${{ github.sha }}"
          
          echo "Generating release notes from $PREVIOUS_TAG to $CURRENT_SHA"
          
          # Generate commit log
          COMMITS=$(git log $PREVIOUS_TAG..$CURRENT_SHA --pretty=format:"- %s (%h)" --no-merges)
          
          # Count commits
          COMMIT_COUNT=$(git rev-list --count $PREVIOUS_TAG..$CURRENT_SHA --no-merges)
          
          # Get date range
          START_DATE=$(git log $PREVIOUS_TAG -1 --format=%ai 2>/dev/null || echo "N/A")
          END_DATE=$(git log $CURRENT_SHA -1 --format=%ai)
          
          # Create release notes
          RELEASE_NOTES="## Deployment to Production
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commits:** $COMMIT_COUNT changes
          **Period:** $START_DATE to $END_DATE
          
          ### Changes:
          $COMMITS
          
          **Deployed by:** ${{ github.actor }}
          **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Save to file for artifact
          echo "$RELEASE_NOTES" > release-notes.md
          
          # Escape for JSON and save to output
          RELEASE_NOTES_JSON=$(echo "$RELEASE_NOTES" | jq -Rs .)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create Deployment Tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="deploy-$(date -u +%Y%m%d-%H%M%S)"
          git tag -a "$TAG_NAME" -m "Deployment on $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push origin "$TAG_NAME"

      - name: Send Release Notes via Resend
        if: success()
        run: |
          RELEASE_NOTES=$(cat release-notes.md)
          
          # Convert markdown to HTML for email
          HTML_CONTENT=$(echo "$RELEASE_NOTES" | sed 's/^## \(.*\)/<h2>\1<\/h2>/' | \
                         sed 's/^### \(.*\)/<h3>\1<\/h3>/' | \
                         sed 's/^\*\*\(.*\):\*\* \(.*\)/<p><strong>\1:<\/strong> \2<\/p>/' | \
                         sed 's/^- \(.*\)/<li>\1<\/li>/' | \
                         sed ':a;N;$!ba;s/<li>\(.*\)<\/li>\n<li>/<li>\1<\/li><li>/g' | \
                         sed 's/<li>\(.*\)<\/li>/<ul><li>\1<\/li><\/ul>/')
          
          # Create JSON payload
          JSON_PAYLOAD=$(jq -n \
            --arg from "${{ secrets.RESEND_FROM_EMAIL }}" \
            --arg to "${{ secrets.RESEND_TO_EMAIL }}" \
            --arg subject "🚀 Deployment to Production - $(date -u +"%Y-%m-%d %H:%M UTC")" \
            --arg html "<html><body style='font-family: Arial, sans-serif; line-height: 1.6; color: #333;'>$HTML_CONTENT</body></html>" \
            '{
              from: $from,
              to: [$to],
              subject: $subject,
              html: $html
            }')
          
          # Send email via Resend API
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      - name: Upload Release Notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30
